{% extends 'quiz/base.html' %}
{% block title %}Edit question | Daymark{% endblock %}
{% block content %}
<div class="narrow wide"><a class="back-link" href="{% url 'dashboard' %}">← Dashboard</a><div class="form-card"><p class="eyebrow">QUESTION BUILDER</p><h1>Edit question</h1><form method="post">{% csrf_token %}<label>Category<select name="category_id" required>{% for category in categories %}<option value="{{ category.id }}"{% if category.id == question.category_id %} selected{% endif %}>Day {{ category.day }} · {{ category.name }}</option>{% endfor %}</select></label><label>Question<textarea name="question_text" rows="3" required>{{ question.text }}</textarea></label><div class="form-row"><label>Option A<input name="option_a" value="{{ question.option_a }}" required></label><label>Option B<input name="option_b" value="{{ question.option_b }}" required></label><label>Option C<input name="option_c" value="{{ question.option_c }}" required></label><label>Option D<input name="option_d" value="{{ question.option_d }}" required></label></div><label>Correct option<select name="correct_option"><option value="A"{% if question.correct_option == 'A' %} selected{% endif %}>A</option><option value="B"{% if question.correct_option == 'B' %} selected{% endif %}>B</option><option value="C"{% if question.correct_option == 'C' %} selected{% endif %}>C</option><option value="D"{% if question.correct_option == 'D' %} selected{% endif %}>D</option></select></label><button class="button primary" type="submit">Save changes</button></form></div></div>
{% endblock %}
