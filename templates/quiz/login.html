{% extends 'quiz/base.html' %}
{% load static %}
{% block title %}Sign in | Quiz{% endblock %}
{% block content %}
<section class="auth-layout login-centered">
  <form method="post" class="form-card login-form">{% csrf_token %}<img class="login-logo" src="{% static 'images/ABT_LOGO_BLACK_NO_BG.png' %}" alt="AB Technologies logo"><label>Username{{ form.username }}</label><label>Password{{ form.password }}</label><button class="button primary" type="submit">Sign in <span>→</span></button>{{ form.non_field_errors }}</form>
</section>
{% endblock %}
