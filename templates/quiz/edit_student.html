{% extends 'quiz/base.html' %}
{% block title %}Edit student | Quiz{% endblock %}
{% block content %}<div class="narrow"><a class="back-link" href="{% url 'dashboard' %}">← Dashboard</a><div class="form-card"><p class="eyebrow">STUDENT MANAGEMENT</p><h1>Edit student</h1><p class="muted">Update the login details for this learner.</p><form method="post">{% csrf_token %}<label>Username<input name="username" value="{{ student.username }}" required autofocus></label><label>New password <span class="muted">(optional)</span><input type="password" name="password" minlength="8" placeholder="Leave blank to keep current password"></label><button class="button primary" type="submit">Save student</button></form></div></div>{% endblock %}
