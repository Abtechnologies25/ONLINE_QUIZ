{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Daymark Quiz{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'quiz/app.css' %}">
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="{% url 'dashboard' %}"><span class="brand-mark">D</span> Daymark</a>
    {% if user.is_authenticated %}
    <div class="nav-user"><span>{{ user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="text-link nav-logout" type="submit">Sign out</button></form></div>
    {% endif %}
  </nav>
  <main class="page-shell">
    {% if messages %}{% for message in messages %}<div class="notice {{ message.tags }}">{{ message }}</div>{% endfor %}{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
